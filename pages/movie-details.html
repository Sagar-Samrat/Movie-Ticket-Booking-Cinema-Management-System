<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | CineVerse</title>

    <link rel="stylesheet" href="../css/movies.css">
    <link rel="stylesheet" href="../css/movie-details.css">
</head>

<body>

    <div class="movie-details-container">

        <a href="movies.html" class="back-btn">← Back to Movies</a>

        <div class="movie-details-card">

            <div class="details-poster">
                <img id="detail-poster" src="" alt="Movie Poster">
            </div>

            <div class="details-info">

                <h1 id="detail-title">Movie Title</h1>

                <p id="detail-rating"></p>

                <p id="detail-genre"></p>

                <p id="detail-description"></p>

                <a href="booking.html" id="detail-book-btn" class="book-btn">
                    Book Tickets
                </a>

            </div>

        </div>

    </div>
    <script src="../js/movie-details.js"></script>

</body>
</html>
